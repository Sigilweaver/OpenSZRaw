[workspace]
resolver = "2"
members = ["crates/openszraw", "crates/openszraw-py"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
authors = ["Nathan Riley <git@nathanriley.com>"]
license = "Apache-2.0"
repository = "https://github.com/Sigilweaver/OpenSZRaw"
homepage = "https://sigilweaver.app/openszraw/"
documentation = "https://sigilweaver.app/openszraw/docs/"
keywords = ["mass-spectrometry", "shimadzu", "raw", "metabolomics", "gcms"]
categories = ["parser-implementations", "science"]

[workspace.dependencies]
openszraw = { path = "crates/openszraw" }
openmassspec-core = "4.0.0"
byteorder = "1.5.0"
cfb = "0.16.0"
thiserror = "2"
log = "0.4"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Pinned to a Core commit until openmassspec-core 4.0.0 is on crates.io.
[patch.crates-io]
openmassspec-core = { git = "https://github.com/Sigilweaver/OpenMassSpecCore", rev = "63b2a3010abea9d2bfd7a74c9e9a413b6a1ade39" }
